name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.29'
          python-version: ${{ matrix.python }}
          enable-cache: false
      - run: uv sync --locked --extra ui --extra dev
      - name: Lint and formatting
        run: |
          uv run --no-sync ruff check src tests .github/scripts
          uv run --no-sync ruff format --check src tests .github/scripts
          bash -n install.sh
      - name: Tests (mock X data only)
        run: uv run --no-sync pytest -q

  core:
    name: Headless package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.29'
          python-version: '3.12'
          enable-cache: false
      - run: uv sync --locked --extra dev
      - name: Core works without the UI
        run: |
          uv run --no-sync python -c "import importlib.util; assert importlib.util.find_spec('gradio') is None"
          uv run --no-sync pytest -q tests/test_runtime.py tests/test_identity.py tests/test_cli.py
