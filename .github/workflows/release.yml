name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and verify packages
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.29'
          python-version: '3.12'
          enable-cache: false
      - name: Only release the matching version from main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          uv run --no-project python .github/scripts/release_version.py
      - name: Build once, including the wheel from the source archive
        run: |
          uv build --sdist
          uv build dist/*.tar.gz --wheel
          uvx --from twine==7.0.0 twine check --strict dist/*
      - name: Install and check the built wheel
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv venv /tmp/xflog-wheel
          uv pip install --python /tmp/xflog-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/xflog-wheel/bin/python -c "import os; from importlib.metadata import version; from xflog import CoreConfig, Runtime; assert version('xflog') == os.environ['RELEASE_TAG'][1:]"
          /tmp/xflog-wheel/bin/xflog --help
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/xflog
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist
      - name: Publish the verified files with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  release:
    name: Create GitHub release and changelog
    needs: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist
      - name: Publish release notes and matching package files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes \
            --title "$RELEASE_TAG" \
            --notes "Install: pip install xflog. Docker: build from source with docker compose up -d --build. See CHANGELOG.md for the first-release feature summary."
