[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xflog"
version = "0.1.0"
description = "A local-first X follower event journal"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "gradio>=6,<7",
    "httpx>=0.28,<1",
    "aiosqlite>=0.21,<1",
    "uvicorn>=0.34,<1",
    "filelock>=3,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1", "playwright>=1.55,<2"]

[project.scripts]
xflog = "xflog.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/xflog"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
