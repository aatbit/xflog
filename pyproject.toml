[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xflog"
version = "1.0.8"
description = "A local-first X follower event journal"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "src/xflog/assets/FONT-LICENSE.txt"]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "aiosqlite>=0.21,<1",
    "filelock>=3,<5",
]

[project.urls]
Homepage = "https://github.com/aatbit/xflog"
Repository = "https://github.com/aatbit/xflog"
Issues = "https://github.com/aatbit/xflog/issues"
Changelog = "https://github.com/aatbit/xflog/releases"

[project.optional-dependencies]
ui = ["fastapi>=0.115,<1", "gradio>=6,<7", "uvicorn>=0.34,<1"]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1", "playwright>=1.55,<2"]

[project.scripts]
xflog = "xflog.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/xflog"]

[tool.hatch.build.targets.sdist]
include = ["src/xflog", "pyproject.toml", "README.md", "LICENSE", "NOTICE"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
