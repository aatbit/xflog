services:
  xflog:
    build: .
    image: xflog:local
    restart: unless-stopped
    init: true
    environment:
      X_APP_BEARER_TOKEN: ${X_APP_BEARER_TOKEN:-}
      X_USER_ID: ${X_USER_ID:-}
      X_USER_ACCESS_TOKEN: ${X_USER_ACCESS_TOKEN:-}
      XFLOG_ORIGIN: ${XFLOG_ORIGIN:-http://127.0.0.1:7860}
      XFLOG_ENV_FILE: ${XFLOG_ENV_FILE:-}
      XFLOG_ADMIN_PASSWORD: ${XFLOG_ADMIN_PASSWORD:-}
      XFLOG_LOOPBACK_PUBLISHED: "1"
      XFLOG_DATABASE: ${XFLOG_DATABASE:-/data/history.sqlite3}
    ports:
      - "127.0.0.1:${XFLOG_PUBLISH_PORT:-7860}:7860"
    volumes:
      - history:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  history:
